name: aiagentblocklist
description: >-
  Dart and Flutter feed client for the AI agent blocklist: sync the daily
  files with conditional downloads and check domains, extensions, processes
  and packages locally.
version: 1.0.0
homepage: https://www.aiagentblocklist.com
repository: https://github.com/explainableaixai/aiagentblocklist-dart
issue_tracker: https://www.aiagentblocklist.com/contact.php

topics:
  - ai-agents
  - blocklist
  - mcp
  - firewall
  - mdm

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: '>=1.1.0 <2.0.0'

dev_dependencies:
  lints: '>=3.0.0 <6.0.0'
  shelf: ^1.4.0
  test: ^1.24.0

# Keywords for discovery (pub.dev uses `topics` above, max five):
# ai-agents, ai-agent-blocklist, blocklist, ai-browser, mcp, coding-agents,
# browser-extensions, dns-filtering, firewall, edl, mdm, shadow-ai, ai-governance
